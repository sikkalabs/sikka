[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/crypto",
    "crates/state",
    "crates/consensus",
    "crates/checkpoint",
    "crates/p2p",
    "crates/rpc",
    "crates/wallet",
    "crates/node",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sikkalabs/sikka"
rust-version = "1.82"

[workspace.dependencies]
sikka-common = { path = "crates/common" }
sikka-crypto = { path = "crates/crypto" }
sikka-state = { path = "crates/state" }
sikka-consensus = { path = "crates/consensus" }
sikka-checkpoint = { path = "crates/checkpoint" }
sikka-p2p = { path = "crates/p2p" }
sikka-rpc = { path = "crates/rpc" }
sikka-wallet = { path = "crates/wallet" }
sikka-node = { path = "crates/node" }

fips204 = "0.4"
sha3 = "0.10"
redb = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Tests exercise ML-DSA-87, which is unusably slow in a fully unoptimised build.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
